name: Auto-Translate README

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "README.tr.md"
  workflow_dispatch:

concurrency:
  group: translate-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    name: Translate README.tr.md to English
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Run Zero-Dependency Translation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/translate-readme.mjs

      - name: Commit & Push English README if Changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-translate README.tr.md to README.md [skip ci]"
            git push
            echo "README.md successfully updated and pushed."
          else
            echo "No changes detected in README.md."
          fi
