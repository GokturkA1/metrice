name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Node.js Tests & PM2 Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Linter (Oxlint)
        run: npx oxlint

      - name: Run Test Suites
        run: npm test

      - name: Validate PM2 Configuration Syntax
        run: |
          node --check ecosystem.config.cjs
          node --check ecosystem.config.js
          node -e "const conf = require('./ecosystem.config.cjs'); if (!conf.apps || !conf.apps[0]) process.exit(1); console.log('PM2 config valid:', conf.apps.map(a => a.name).join(', '));"

      - name: Test PM2 Lifecycle
        run: |
          npm install -g pm2
          pm2 start ecosystem.config.cjs
          pm2 status
          pm2 stop ecosystem.config.cjs
          pm2 delete all
