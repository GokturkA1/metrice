services:
  metrice:
    image: ghcr.io/gokturka1/metrice:latest
    build: .
    container_name: metrice-node
    restart: always
    ports:
      - "8001:8001"
      - "2223:2223"
      - "2222:2222"
    environment:
      - SERVER_NAME=metrice-de.gokturka.net
      - TRUST_PROXY=true
      - MESH_ROLE=RELAY
      - FED_PORT=8001
      - SSH_PORT=2223
      - CLIENT_PORT=2222
      - LOG_LEVEL=INFO
      - DB_FILE=/app/data/data_8001.db
      - PEER_FILE=/app/data/peers_8001.json
    volumes:
      # Yerel gelistirme aninda anlik kod senkronizasyonu icin acilabilir:
      # - .:/app
      - ./data:/app/data
