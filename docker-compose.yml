services:
  metrice:
    image: ghcr.io/gokturka1/metrice:latest
    build: .
    container_name: metrice-node
    restart: always
    ports:
      - "8001:8001"
      - "2223:2223"
      - "2222:2222"
    environment:
      # AutoNAT konsensüsü genel IP adresini otomatik olarak tespit eder.
      # Yalnizca ozel bir FQDN/domain kullanmak isterseniz aciniz:
      # - SERVER_NAME=node.example.com
      - TRUST_PROXY=true
      - MESH_ROLE=RELAY
      - FED_PORT=8001
      - SSH_PORT=2223
      - CLIENT_PORT=2222
      - LOG_LEVEL=INFO
      - DB_FILE=/app/data/data_8001.db
      - PEER_FILE=/app/data/peers_8001.json
      # TCP Saglik & Kalp Atisi Portu (Varsayilan: 8050, yalnizca container ici/127.0.0.1)
      # Dis agdan/monitorden erisim icin:
      # - ALLOW_OUTER_HEARTBEAT=true
      # - HEALTH_PORT=8050
    volumes:
      # Yerel gelistirme aninda anlik kod senkronizasyonu icin acilabilir:
      # - .:/app
      - ./data:/app/data
